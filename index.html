<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b4da3" />
    <title>Inclusive Games — когнітивні ігри для дітей</title>
    <!--
      Мета головної. Для кожної публічної сторінки збірка пише окремий HTML з
      її власною назвою й описом (src/data/seo.js, vite.config.js) — месенджери
      складають картку посилання з HTML, не виконуючи JavaScript.
    -->
    <meta
      name="description"
      content="Короткі ігри-вправи на увагу, пам’ять, мислення, слух, простір і саморегуляцію для дітей. Для уроку, заняття з фахівцем і дому — з адаптаціями для дітей з особливими потребами."
    />
    <link rel="canonical" href="https://inclusive-games.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inclusive Games" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Inclusive Games — когнітивні ігри для дітей" />
    <meta
      property="og:description"
      content="Короткі ігри-вправи на увагу, пам’ять, мислення, слух, простір і саморегуляцію для дітей. Для уроку, заняття з фахівцем і дому — з адаптаціями для дітей з особливими потребами."
    />
    <meta property="og:url" content="https://inclusive-games.vercel.app/" />
    <meta property="og:image" content="https://inclusive-games.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Inclusive Games — ігри, що тренують увагу, пам’ять і мислення" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inclusive Games — когнітивні ігри для дітей" />
    <meta
      name="twitter:description"
      content="Короткі ігри-вправи на увагу, пам’ять, мислення, слух, простір і саморегуляцію для дітей. Для уроку, заняття з фахівцем і дому — з адаптаціями для дітей з особливими потребами."
    />
    <meta name="twitter:image" content="https://inclusive-games.vercel.app/og-image.png" />
    <script>
      // Runs before first paint so a dark-theme user never sees a white flash
      // while the bundle loads. Deliberately duplicates a few lines of
      // lib/settings.js: React starts too late to prevent the flash, and the
      // storage key and the shape it reads are asserted in settings.test.js.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('inclusive-games:settings') || '{}')
          var theme = stored.theme || 'system'
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Запобіжник проти порожнього екрана. Якщо головний скрипт так і не
      // запустився (зіпсований кеш після деплою, старий браузер), React нічого
      // не намалює і дитина бачить лише тло. Через 10 секунд показуємо, що
      // сталося, і кнопку, яка чистить кеш сайту на цьому пристрої. main.jsx
      // ставить window.__igBooted, щойно стартує, — тоді запобіжник мовчить.
      setTimeout(function () {
        if (window.__igBooted) return
        var root = document.getElementById('root')
        if (root && root.childElementCount > 0) return
        var box = document.createElement('div')
        box.id = 'boot-fallback'
        box.setAttribute('role', 'alert')
        box.style.cssText =
          'max-width:32rem;margin:15vh auto 0;padding:24px;font:17px/1.5 system-ui,sans-serif;' +
          'color:#1b2430;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.25)'
        box.innerHTML =
          '<h1 style="margin:0 0 8px;font-size:22px;color:#1b2430">Сайт не завантажився</h1>' +
          '<p style="margin:0 0 16px;color:#1b2430">Найчастіше це застарілі файли сайту, що лишилися на пристрої після оновлення. ' +
          'Кнопка нижче прибере їх і завантажить сайт заново. Ваші результати не зникнуть.</p>' +
          '<button type="button" style="font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;' +
          'background:#0b4da3;color:#fff;cursor:pointer">Оновити сайт</button>'
        box.querySelector('button').onclick = function () {
          var jobs = []
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister() }))
            }))
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) { return caches.delete(name) }))
            }))
          }
          Promise.all(jobs).catch(function () {}).then(function () { location.reload() })
        }
        document.body.appendChild(box)
      }, 10000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
